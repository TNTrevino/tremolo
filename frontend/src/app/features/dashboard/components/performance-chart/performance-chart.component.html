<div appCard className="shadow-lg">
	<div appCardHeader>
		<div
			class="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center"
		>
			<h3 appCardTitle className="text-2xl">Performance</h3>
			<div class="flex w-full flex-col gap-2 sm:flex-row md:w-auto">
				@if (isTeacher()) {
					<div class="flex gap-2">
						<app-button
							size="sm"
							[variant]="viewMode() === 'my' ? 'default' : 'outline'"
							(click)="viewModeChange.emit('my')"
						>
							My Data
						</app-button>
						<app-button
							size="sm"
							[variant]="viewMode() === 'class' ? 'default' : 'outline'"
							(click)="viewModeChange.emit('class')"
						>
							Class Data
						</app-button>
					</div>
				}

				<app-select
					ariaLabel="Chart interval"
					[value]="interval()"
					(valueChange)="onIntervalChange($event)"
				>
					<option value="day">Daily</option>
					<option value="week">Weekly</option>
					<option value="month">Monthly</option>
					<option value="year">Yearly</option>
				</app-select>
			</div>
		</div>
	</div>
	<div appCardContent>
		@if (hasTrend()) {
			<app-tremolo-line-chart
				ariaLabel="Performance over time"
				xKey="time"
				[data]="points()"
				[series]="series"
				[height]="360"
				[xTickFormatter]="xTickFormatter()"
				[tooltipLabelFormatter]="tooltipLabelFormatter()"
				[referenceLines]="referenceLines()"
				[initialHiddenSeries]="initiallyHidden"
			/>
		} @else {
			<div
				class="flex h-[320px] items-center justify-center text-sm text-muted-foreground"
			>
				Not enough data yet — play a few games to see your trend.
			</div>
		}
	</div>
</div>
