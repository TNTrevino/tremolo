<div class="min-h-screen px-4 py-8">
	<div class="container mx-auto max-w-6xl space-y-6">
		<!-- Profile card -->
		<div appCard className="shadow-lg">
			<div appCardContent className="p-6">
				<div
					class="flex flex-col items-center gap-6 md:flex-row md:items-start"
				>
					<div appSkeleton class="h-24 w-24 flex-shrink-0 rounded-full"></div>

					<div class="flex-1 space-y-2 text-center md:text-left">
						<div appSkeleton class="mx-auto h-9 w-48 md:mx-0"></div>
						<div
							class="flex flex-wrap items-center justify-center gap-2 md:justify-start"
						>
							<div appSkeleton class="h-6 w-20"></div>
							<div appSkeleton class="h-6 w-32"></div>
						</div>
					</div>

					<div class="grid grid-cols-2 gap-4">
						<div class="text-center">
							<div appSkeleton class="mx-auto mb-1 h-9 w-16"></div>
							<div appSkeleton class="h-4 w-24"></div>
						</div>
						<div class="text-center">
							<div appSkeleton class="mx-auto mb-1 h-9 w-16"></div>
							<div appSkeleton class="h-4 w-24"></div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Performance chart -->
		<div appCard className="shadow-lg">
			<div appCardHeader>
				<div
					class="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center"
				>
					<div appSkeleton class="h-8 w-48"></div>
					<div appSkeleton class="h-10 w-32"></div>
				</div>
			</div>
			<div appCardContent>
				<div appSkeleton class="h-[400px] w-full"></div>
			</div>
		</div>

		<!-- Stats grid -->
		<div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
			@for (card of statCards; track card) {
				<div appCard className="hover:shadow-lg transition-shadow">
					<div appCardContent className="p-6">
						<div class="flex items-start justify-between">
							<div class="space-y-2">
								<div appSkeleton class="h-4 w-24"></div>
								<div appSkeleton class="h-9 w-16"></div>
							</div>
							<div appSkeleton class="h-10 w-10 rounded-lg"></div>
						</div>
					</div>
				</div>
			}
		</div>
	</div>
</div>
