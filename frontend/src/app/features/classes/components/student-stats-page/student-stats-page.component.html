<div class="min-h-screen py-8 px-4">
	<div class="container mx-auto max-w-4xl space-y-6">
		<a
			routerLink="/classes/{{ classId() }}"
			class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground transition-colors"
		>
			<ng-icon name="lucideArrowLeft" size="1rem" aria-hidden="true" />
			Back to class
		</a>

		@if (profile.status() === "loading") {
			<div class="flex items-center justify-center h-40">
				<ng-icon
					name="lucideLoader2"
					size="1.5rem"
					aria-hidden="true"
					class="animate-spin text-muted-foreground"
				/>
			</div>
		} @else if (profile.error()) {
			<app-error [error]="profile.error()" />
		} @else if (profile.value(); as user) {
			<app-user-profile-card
				[user]="user"
				[totalSessions]="user.totalEntries"
				[timeReading]="timeReading()"
			/>

			@if (chart.status() === "loading") {
				<div class="flex items-center justify-center h-40">
					<ng-icon
						name="lucideLoader2"
						size="1.5rem"
						aria-hidden="true"
						class="animate-spin text-muted-foreground"
					/>
				</div>
			} @else if (chart.error()) {
				<app-error [error]="chart.error()" />
			} @else {
				<app-performance-chart
					[chartData]="chart.value() ?? EMPTY_CHART"
					[interval]="interval()"
					(intervalChange)="interval.set($event)"
				/>
			}
		} @else {
			<div
				class="flex flex-col items-center justify-center h-40 gap-2 text-center"
			>
				<p class="text-sm font-medium text-muted-foreground">
					Student not found, or you don’t have access to it.
				</p>
				<a
					routerLink="/classes/{{ classId() }}"
					class="text-sm text-primary underline"
					>Back to class</a
				>
			</div>
		}
	</div>
</div>
