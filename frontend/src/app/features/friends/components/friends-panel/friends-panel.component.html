@if (ui.isPanelOpen()) {
	<div
		class="fixed inset-0 top-16 z-40 bg-black/50 md:hidden"
		role="button"
		tabindex="0"
		aria-label="Close friends panel"
		(click)="ui.togglePanel()"
		(keydown.enter)="ui.togglePanel()"
		(keydown.space)="ui.togglePanel()"
	></div>
}

<aside [class]="asideClasses()">
	@if (isAddMode()) {
		<app-add-friend-view (back)="isAddMode.set(false)" />
	} @else {
		<app-my-friends-view
			(addFriend)="isAddMode.set(true)"
			(closed)="ui.togglePanel()"
		/>
	}
</aside>
