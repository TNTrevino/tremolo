<div
	class="flex items-center gap-3 p-3 rounded-lg transition-colors hover:bg-accent/50"
>
	<img
		[src]="user().avatarUrl"
		[alt]="user().firstName + ' ' + user().lastName"
		class="h-10 w-10 rounded-full"
	/>
	<div class="flex-1 min-w-0">
		<span class="text-sm font-medium truncate block"
			>{{ user().firstName }} {{ user().lastName }}</span
		>
		@if (user().instrument) {
			<p class="text-xs text-muted-foreground truncate">
				{{ user().instrument }}
			</p>
		}
		@if (user().school) {
			<p class="text-xs text-muted-foreground truncate">{{ user().school }}</p>
		}
	</div>
	<ng-content />
</div>
