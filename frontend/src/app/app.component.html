<!--
	The app shell, mirroring `AppContent` in frontend-react/src/App.tsx:
	navigation above the routed page, the friends panel beside it for a
	signed-in user, toasts pinned over everything.
-->
<div class="min-h-screen bg-background text-foreground">
	<app-navigation />
	<app-verify-email-banner />
	<router-outlet />
	@if (auth.isAuthenticated()) {
		<app-friends-panel />
	}
	<app-footer />
	<app-toast-container />
</div>
