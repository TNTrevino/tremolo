<section class="mx-auto flex min-h-screen max-w-md flex-col justify-center p-8">
	<h1 class="font-display text-3xl font-bold tracking-tight">
		Welcome to Tremolo
	</h1>
	<p class="text-muted-foreground">Sign in to continue your musical journey</p>

	@if (errorMessage(); as message) {
		<p role="alert" class="text-destructive">{{ message }}</p>
	}

	<form (submit)="submit($event)" class="flex flex-col gap-4">
		<div class="flex flex-col gap-1">
			<label for="email">Email Address</label>
			<input
				id="email"
				name="email"
				type="email"
				autocomplete="email"
				class="border p-2"
				[value]="email()"
				(input)="email.set(value($event))"
			/>
		</div>

		<div class="flex flex-col gap-1">
			<label for="password">Password</label>
			<input
				id="password"
				name="password"
				type="password"
				autocomplete="current-password"
				class="border p-2"
				[value]="password()"
				(input)="password.set(value($event))"
			/>
		</div>

		<button type="submit" class="border p-2" [disabled]="pending()">
			Sign In
		</button>
	</form>

	<p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
</section>
