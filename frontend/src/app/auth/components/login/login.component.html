<section class="flex min-h-screen items-center justify-center px-4 py-12">
	<div appCard className="w-full max-w-md shadow-lg">
		<div appCardHeader className="space-y-1 text-center">
			<div class="mb-4 flex justify-center">
				<div class="rounded-lg bg-primary p-3">
					<ng-icon
						name="lucideMusic"
						size="2rem"
						aria-hidden="true"
						class="text-primary-foreground"
					/>
				</div>
			</div>
			<h1 appCardTitle className="font-display text-3xl">Welcome to Tremolo</h1>
			<p appCardDescription className="text-base">
				Sign in to continue your musical journey
			</p>
		</div>

		<form (submit)="submit($event)">
			<div appCardContent className="flex flex-col gap-4">
				@if (notice(); as pending) {
					<p
						[attr.role]="pending.kind === 'error' ? 'alert' : 'status'"
						[class]="
							pending.kind === 'error'
								? 'rounded-md border-2 border-destructive bg-destructive/10 p-3 text-sm font-medium text-destructive'
								: 'rounded-md border-2 border-primary bg-primary/10 p-3 text-sm font-medium'
						"
					>
						{{ pending.message }}
					</p>
				}

				@if (errorMessage(); as message) {
					<p
						role="alert"
						class="rounded-md border-2 border-destructive bg-destructive/10 p-3 text-sm font-medium text-destructive"
					>
						{{ message }}
					</p>
				}

				<app-form-field
					label="Email Address"
					htmlFor="email"
					[field]="loginForm.email"
				>
					<input
						appFormInput
						id="email"
						type="email"
						autocomplete="email"
						placeholder="you@example.com"
						[formField]="loginForm.email"
					/>
				</app-form-field>

				<app-form-field
					label="Password"
					htmlFor="password"
					[field]="loginForm.password"
				>
					<div class="relative">
						<input
							appFormInput
							id="password"
							class="pr-10"
							autocomplete="current-password"
							placeholder="••••••••"
							[type]="showPassword() ? 'text' : 'password'"
							[formField]="loginForm.password"
						/>
						<!--
							No aria-label, deliberately. `getByLabel("Password")` in the
							parity suite is a substring match, so any name containing
							"password" would match this button as well as the field and
							trip Playwright's strict mode. React leaves it unnamed for
							the same reason -- see phase-3-subfeature-1-handoff.md.
						-->
						<button
							type="button"
							class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors hover:text-foreground"
							(click)="togglePassword()"
						>
							<ng-icon
								size="1rem"
								[name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'"
								aria-hidden="true"
								class="h-4 w-4"
							/>
						</button>
					</div>
				</app-form-field>
			</div>

			<div appCardFooter className="flex-col gap-4">
				<app-button
					type="submit"
					variant="brass"
					size="lg"
					className="w-full"
					[loading]="pending()"
				>
					Sign In
				</app-button>

				<div class="relative w-full">
					<div class="absolute inset-0 flex items-center">
						<span class="w-full border-t"></span>
					</div>
					<div class="relative flex justify-center text-xs uppercase">
						<span class="bg-card px-2 text-muted-foreground"
							>Or continue with</span
						>
					</div>
				</div>

				<app-google-sign-in-button />

				<p class="text-center text-sm text-muted-foreground">
					<a
						routerLink="/forgot-password"
						class="font-medium text-primary underline-offset-4 hover:underline"
						>Forgot password?</a
					>
				</p>

				<p class="text-center text-sm text-muted-foreground">
					Don't have an account?
					<a
						routerLink="/signup"
						class="font-medium text-primary underline-offset-4 hover:underline"
						>Sign up</a
					>
				</p>
			</div>
		</form>
	</div>
</section>
