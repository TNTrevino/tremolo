<section class="flex min-h-screen items-center justify-center px-4 py-12">
	<div appCard className="w-full max-w-md shadow-lg">
		<div appCardHeader className="space-y-1 text-center">
			<div class="mb-4 flex justify-center">
				<div class="rounded-lg bg-primary p-3">
					<ng-icon
						name="lucideMusic"
						size="2rem"
						aria-hidden="true"
						class="text-primary-foreground"
					/>
				</div>
			</div>
			<h1 appCardTitle className="font-display text-3xl">
				Choose a new password
			</h1>
			<p appCardDescription className="text-base">
				Enter a new password for your account
			</p>
		</div>

		@if (!token()) {
			<div appCardContent className="flex flex-col gap-4">
				<p
					role="alert"
					class="rounded-md border-2 border-destructive bg-destructive/10 p-3 text-sm font-medium text-destructive"
				>
					This password reset link is invalid or has expired.
				</p>
			</div>

			<div appCardFooter className="flex-col gap-4">
				<p class="text-center text-sm text-muted-foreground">
					<a
						routerLink="/forgot-password"
						class="font-medium text-primary underline-offset-4 hover:underline"
						>Request a new link</a
					>
				</p>
			</div>
		} @else {
			<form (submit)="submit($event)">
				<div appCardContent className="flex flex-col gap-4">
					@if (errorMessage(); as message) {
						<p
							role="alert"
							class="rounded-md border-2 border-destructive bg-destructive/10 p-3 text-sm font-medium text-destructive"
						>
							{{ message }}
						</p>
					}

					<app-form-field
						label="New Password"
						htmlFor="password"
						[field]="resetPasswordForm.password"
					>
						<div class="relative">
							<input
								appFormInput
								id="password"
								class="pr-10"
								autocomplete="new-password"
								placeholder="••••••••"
								[type]="showPassword() ? 'text' : 'password'"
								[formField]="resetPasswordForm.password"
							/>
							<!-- Unnamed on purpose; see the note in login.component.html. -->
							<button
								type="button"
								class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors hover:text-foreground"
								(click)="togglePassword()"
							>
								<ng-icon
									size="1rem"
									[name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'"
									aria-hidden="true"
									class="h-4 w-4"
								/>
							</button>
						</div>
					</app-form-field>

					<app-form-field
						label="Confirm Password"
						htmlFor="confirmPassword"
						[field]="resetPasswordForm.confirmPassword"
					>
						<div class="relative">
							<input
								appFormInput
								id="confirmPassword"
								class="pr-10"
								autocomplete="new-password"
								placeholder="••••••••"
								[type]="showConfirmPassword() ? 'text' : 'password'"
								[formField]="resetPasswordForm.confirmPassword"
							/>
							<!-- Unnamed on purpose; see the note in login.component.html. -->
							<button
								type="button"
								class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors hover:text-foreground"
								(click)="toggleConfirmPassword()"
							>
								<ng-icon
									size="1rem"
									[name]="showConfirmPassword() ? 'lucideEyeOff' : 'lucideEye'"
									aria-hidden="true"
									class="h-4 w-4"
								/>
							</button>
						</div>
					</app-form-field>
				</div>

				<div appCardFooter className="flex-col gap-4">
					<app-button
						type="submit"
						variant="brass"
						size="lg"
						className="w-full"
						[loading]="pending()"
					>
						Update password
					</app-button>
				</div>
			</form>
		}
	</div>
</section>
