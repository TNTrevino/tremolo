<section class="flex min-h-screen items-center justify-center px-4 py-12">
	<div appCard className="w-full max-w-md shadow-lg">
		<div appCardHeader className="space-y-1 text-center">
			<div class="mb-4 flex justify-center">
				<div class="rounded-lg bg-primary p-3">
					<ng-icon
						name="lucideMusic"
						size="2rem"
						aria-hidden="true"
						class="text-primary-foreground"
					/>
				</div>
			</div>
			<h1 appCardTitle className="font-display text-3xl">
				Forgot your password?
			</h1>
			<p appCardDescription className="text-base">
				Enter your email and we'll send you a reset link
			</p>
		</div>

		@if (confirmationMessage(); as message) {
			<div appCardContent className="flex flex-col gap-4">
				<p
					role="status"
					class="rounded-md border-2 border-primary bg-primary/10 p-3 text-sm font-medium"
				>
					{{ message }}
				</p>
			</div>

			<div appCardFooter className="flex-col gap-4">
				<p class="text-center text-sm text-muted-foreground">
					<a
						routerLink="/login"
						class="font-medium text-primary underline-offset-4 hover:underline"
						>Back to login</a
					>
				</p>
			</div>
		} @else {
			<form (submit)="submit($event)">
				<div appCardContent className="flex flex-col gap-4">
					@if (errorMessage(); as message) {
						<p
							role="alert"
							class="rounded-md border-2 border-destructive bg-destructive/10 p-3 text-sm font-medium text-destructive"
						>
							{{ message }}
						</p>
					}

					<app-form-field
						label="Email Address"
						htmlFor="email"
						[field]="forgotPasswordForm.email"
					>
						<input
							appFormInput
							id="email"
							type="email"
							autocomplete="email"
							placeholder="you@example.com"
							[formField]="forgotPasswordForm.email"
						/>
					</app-form-field>
				</div>

				<div appCardFooter className="flex-col gap-4">
					<app-button
						type="submit"
						variant="brass"
						size="lg"
						className="w-full"
						[loading]="pending()"
					>
						Send reset link
					</app-button>

					<p class="text-center text-sm text-muted-foreground">
						Remembered it?
						<a
							routerLink="/login"
							class="font-medium text-primary underline-offset-4 hover:underline"
							>Back to login</a
						>
					</p>
				</div>
			</form>
		}
	</div>
</section>
