name: API Smoke Tests

# End-to-end HTTP tests (kulala) against the real running Go service.
# These cover the seam the Go unit tests can't: routing, JWT middleware,
# JSON binding, and controller -> HTTP status mapping.

on:
  push:
    branches: [main]
    paths:
      - "core-api/**"
      - ".github/workflows/api-smoke.yml"
      - "Makefile"
  # Reusable, and the only path this runs on a PR: the CI gate calls it
  # for the services a PR touches, and the deploy workflows call it as a
  # gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix + github.workflow keeps each entry point in its own lane. Under
  # workflow_call github.workflow is the CALLER's name, so the prefix stops
  # the workflows a caller invokes together from sharing a group, and
  # github.workflow stops different callers (CI gate, deploy) from sharing
  # one. Same group + cancel-in-progress means they cancel each other.
  group: api-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: api-smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tremolo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tremolo?sslmode=disable
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      ACCESS_TOKEN_EXPIRY_MINUTES: "15"
      REFRESH_TOKEN_EXPIRY_HOURS: "168"
      MAX_LOGIN_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret
      USER_SERVICE_PORT: "5001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: core-api/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Build separately so a compile failure reads as a build error, not
      # a mysterious "service never came up".
      - name: Build service
        working-directory: core-api
        run: go build -o /tmp/tremolo-main .

      - name: Start service (migrations run on startup)
        working-directory: core-api
        run: |
          /tmp/tremolo-main > /tmp/tremolo-main.log 2>&1 &
          echo "SERVICE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/health >/dev/null 2>&1; then
              echo "service is up"; exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy in time; last logs:" >&2
          cat /tmp/tremolo-main.log >&2 || true
          exit 1

      # kulala is pinned via the Makefile's KULALA var so CI and local
      # dev run the exact same command.
      - name: Run API smoke tests
        run: make test-api

      - name: Service logs on failure
        if: failure()
        run: cat /tmp/tremolo-main.log || true
