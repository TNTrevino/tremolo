name: Deploy Prod - Pi

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  # All three suites must be green before anything touches the server.
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit
  go-ci:
    uses: ./.github/workflows/core-api.yml
  music-ci:
    uses: ./.github/workflows/music-api.yml

  deploy:
    needs: [frontend-ci, go-ci, music-ci]
    uses: ./.github/workflows/deploy.yml
    with:
      runner: geekom
      frontend-dest: reverse-proxy:/var/www/tremolo/
