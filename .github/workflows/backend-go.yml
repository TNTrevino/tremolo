name: Go Backend CI

# No pull_request trigger: on a PR this runs once, via the CI gate
# (.github/workflows/ci.yml) as a workflow_call. The gate path-filters to
# backend/main, this workflow, and the Makefile -- the same paths this used
# to filter on directly -- so PR coverage is unchanged with no double-run.
on:
  push:
    branches: [main]
    paths:
      - "backend/main/**"
      - ".github/workflows/backend-go.yml"
      - "Makefile"
  # Reusable: the CI gate and the deploy workflows run this via workflow_call.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix with the caller's workflow name so a gate-invoked run and any
  # other caller of this reusable workflow never share a group.
  group: ${{ github.workflow }}-go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tremolo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tremolo?sslmode=disable
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      ACCESS_TOKEN_EXPIRY_MINUTES: "15"
      REFRESH_TOKEN_EXPIRY_HOURS: "168"
      MAX_LOGIN_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: backend/main/go.sum

      # gofmt/vet/tests live in the Makefile so CI and local dev can't
      # drift; golangci-lint stays an action because it installs and
      # caches its own binary.
      - name: Check formatting
        run: make format-check-go

      - name: Run go vet
        run: make vet-go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10
          working-directory: backend/main

      - name: Run tests
        run: make test-go
