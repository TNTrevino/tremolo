name: Go Backend CI

on:
  pull_request:
    branches:
      - main
      - prod
    paths:
      - "backend/main/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/main

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tremolo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tremolo?sslmode=disable
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      ACCESS_TOKEN_EXPIRY_MINUTES: "15"
      REFRESH_TOKEN_EXPIRY_HOURS: "168"
      MAX_LOGIN_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"
      GOOGLE_CLIENT_ID: ci-test-client-id
      GOOGLE_CLIENT_SECRET: ci-test-client-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: backend/main/go.sum

      - name: Check formatting
        run: |
          echo "🧹 Checking Go code formatting..."
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: Run go vet
        run: |
          echo "🔍 Running go vet..."
          go vet ./...
          echo "✅ go vet passed"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10
          working-directory: backend/main

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          go test -v -race -coverprofile=coverage.out ./...
          echo "✅ Tests passed"

      - name: Check test coverage
        run: |
          echo "📊 Test coverage:"
          go tool cover -func=coverage.out
