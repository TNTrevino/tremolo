name: Frontend CI

on:
  pull_request:
    branches: [main, prod]
    paths:
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Check formatting with Prettier
        run: |
          echo "🎨 Checking code formatting..."
          npx prettier --check .

      - name: Lint with ESLint
        run: |
          echo "🔍 Running linter..."
          npm run lint

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          npm run test:run

      - name: Build
        run: |
          echo "🚀 Building application..."
          npm run build
        env:
          VITE_BACKEND_MAIN: ${{ secrets.VITE_BACKEND_MAIN }}
          VITE_BACKEND_MUSIC: ${{ secrets.VITE_BACKEND_MUSIC }}
