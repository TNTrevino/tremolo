name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  # Reusable, and the only path this runs on a PR: the CI gate calls it
  # for the services a PR touches, and the deploy workflows call it as a
  # gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix + github.workflow keeps each entry point in its own lane. Under
  # workflow_call github.workflow is the CALLER's name, so the prefix stops
  # the workflows a caller invokes together from sharing a group, and
  # github.workflow stops different callers (CI gate, deploy) from sharing
  # one. Same group + cancel-in-progress means they cancel each other.
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend: the Angular app in frontend/. Node comes from
  # frontend/.nvmrc -- Angular 22 supports ^22.22.3 || ^24.15.0 || >=26.0.0
  # and nothing else, and the system Node on the dev machine satisfies none
  # of them, so the pin is load-bearing rather than decorative.
  #
  # There was a second job here, react-checks, for the outgoing React app.
  # Phase 7 of the migration deleted frontend-react/ and this job is the
  # whole frontend gate now. See frontend/.migration/.
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: format-check + lint + build + test, in that order --
      # build runs before the test suite so a broken build fails fast.
      #
      # The E2E suite (frontend/e2e/) is deliberately NOT here: it needs
      # both backends and a seeded database, and the repo has no such job.
      # It is the migration's regression suite and is run by hand against a
      # local server -- see frontend/e2e/README.md.
      - name: Check (format + lint + build + test)
        run: make check-frontend
