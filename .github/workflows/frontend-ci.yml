name: Frontend CI

# No pull_request trigger: on a PR this runs once, via the CI gate
# (.github/workflows/ci.yml) as a workflow_call. The gate path-filters to
# frontend, this workflow, and the Makefile -- the same paths this used to
# filter on directly -- so PR coverage is unchanged with no double-run.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  # Reusable: the CI gate and the deploy workflows run this via workflow_call.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix with the caller's workflow name so a gate-invoked run and any
  # other caller of this reusable workflow never share a group.
  group: ${{ github.workflow }}-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: format-check + lint + test + build.
      - name: Check (format + lint + test + build)
        run: make check-frontend
        env:
          VITE_BACKEND_MAIN: ${{ secrets.VITE_BACKEND_MAIN }}
          VITE_BACKEND_MUSIC: ${{ secrets.VITE_BACKEND_MUSIC }}
