name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "frontend-react/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  # Reusable, and the only path this runs on a PR: the CI gate calls it
  # for the services a PR touches, and the deploy workflows call it as a
  # gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix + github.workflow keeps each entry point in its own lane. Under
  # workflow_call github.workflow is the CALLER's name, so the prefix stops
  # the workflows a caller invokes together from sharing a group, and
  # github.workflow stops different callers (CI gate, deploy) from sharing
  # one. Same group + cancel-in-progress means they cancel each other.
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The Angular app (frontend/). Node comes from frontend/.nvmrc: Angular 22
  # supports ^22.22.3 || ^24.15.0 || >=26.0.0 and nothing else.
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: format-check + lint + test + build.
      - name: Check (format + lint + test + build)
        run: make check-frontend

  # The outgoing React app (frontend-react/). It is the executable spec for
  # the migration's parity harness, so it stays green until Phase 7 deletes
  # it -- see frontend/.migration/.
  react-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Check (format + lint + test + build)
        run: make check-react
        env:
          VITE_BACKEND_MAIN: ${{ secrets.VITE_BACKEND_MAIN }}
          VITE_BACKEND_MUSIC: ${{ secrets.VITE_BACKEND_MUSIC }}
