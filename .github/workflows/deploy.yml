name: Deploy

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      frontend-dest:
        required: true
        type: string

# One deploy at a time per target; never cancel one mid-restart.
concurrency:
  group: deploy-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    env:
      UV_PYTHON_INSTALL_DIR: /opt/tremolo/python
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter so prod matches what music CI validates against
      # (music-microservice.yml also uses 3.14). Without this, the venv is
      # built against whatever python3 happens to be on the runner.
      #
      # uv rather than actions/setup-python: setup-python only publishes
      # arm64 Linux builds for LTS releases, so it cannot serve 3.14 to an
      # arm64 runner on an interim Ubuntu. uv builds are per-arch, not
      # per-distro. Install under /opt so the interpreter the deployed venv
      # symlinks to stays readable regardless of which user the runner runs as.
      - name: Set up Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"

      # frontend-react/, not frontend/: the Angular migration moved the
      # live app aside and frontend/ is still a shell. Phase 7 (cutover)
      # points this back at frontend/ -- see frontend/.migration/.
      - name: Build Frontend
        working-directory: frontend-react
        run: |
          set -a && source /etc/tremolo/.env && set +a
          npm ci
          npm run build

      - name: Build Go Service
        working-directory: backend/main
        run: |
          go build -o tremolo-api main.go

      - name: Setup Python venv
        working-directory: backend/music
        run: |
          uv venv --python 3.14 env
          uv pip install --python env/bin/python -r requirements.txt

      - name: Stop Services
        run: |
          sudo systemctl stop tremolo-api
          sudo systemctl stop tremolo-music

      - name: Deploy Artifacts
        run: |
          mkdir -p /opt/tremolo/backend/main
          mkdir -p /opt/tremolo/backend/music
          cp backend/main/tremolo-api /opt/tremolo/backend/main/tremolo-api
          rsync -a --delete backend/music/ /opt/tremolo/backend/music/

      - name: Start Services
        run: |
          sudo systemctl start tremolo-api
          sudo systemctl start tremolo-music

      - name: Sync Frontend to Reverse Proxy
        run: |
          rsync -avz --delete frontend-react/dist/ ${{ inputs.frontend-dest }}

      - name: Health Check
        run: |
          set -a && source /etc/tremolo/.env && set +a
          sleep 5
          curl -f http://localhost:$USER_SERVICE_PORT/health
          curl -f http://localhost:$MUSIC_SERVICE_PORT/music/health
