name: Deploy

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      frontend-dest:
        required: true
        type: string

# One deploy at a time per target; never cancel one mid-restart.
concurrency:
  group: deploy-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    env:
      UV_PYTHON_INSTALL_DIR: /opt/tremolo/python
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter so prod matches what music CI validates against
      # (music-api.yml also uses 3.14). Without this, the venv is
      # built against whatever python3 happens to be on the runner.
      #
      # uv rather than actions/setup-python: setup-python only publishes
      # arm64 Linux builds for LTS releases, so it cannot serve 3.14 to an
      # arm64 runner on an interim Ubuntu. uv builds are per-arch, not
      # per-distro. Install under /opt so the interpreter the deployed venv
      # symlinks to stays readable regardless of which user the runner runs as.
      - name: Set up Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      # Angular has no equivalent of Vite's import.meta.env: a production
      # build substitutes environment.prod.ts for environment.ts via
      # angular.json's fileReplacements, and that is a source file, not a
      # runtime lookup. So the values have to be written before the build.
      #
      # environment.prod.ts is committed with %TOKEN% placeholders and
      # scripts/envsub.sh fills them in from /etc/tremolo/.env -- the same
      # file the React build sourced its VITE_* vars from. They are not
      # committed as values for two reasons. This workflow serves BOTH
      # targets (prod on geekom, QA on pi), which have different API hosts,
      # so one committed file cannot be right for both; and it keeps the
      # OAuth client id with the rest of the deployment config.
      #
      # The file shape lives in TypeScript rather than in a heredoc here, so
      # a new key is one line there plus one line in envsub.sh, and the
      # committed file stays type-checked and Prettier-formatted. The script
      # hard-fails on an unset var and on a token it did not substitute.
      - name: Write Angular production environment
        run: |
          set -a && source /etc/tremolo/.env && set +a
          scripts/envsub.sh

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Go Service
        working-directory: core-api
        run: |
          go build -o tremolo-api .

      - name: Setup Python venv
        working-directory: music-api
        run: |
          uv venv --python 3.14 env
          uv pip install --python env/bin/python -r requirements.txt

      - name: Stop Services
        run: |
          sudo systemctl stop tremolo-api
          sudo systemctl stop tremolo-music

      - name: Deploy Artifacts
        run: |
          mkdir -p /opt/tremolo/core-api
          mkdir -p /opt/tremolo/music-api
          cp core-api/tremolo-api /opt/tremolo/core-api/tremolo-api
          rsync -a --delete music-api/ /opt/tremolo/music-api/

      - name: Start Services
        run: |
          sudo systemctl start tremolo-api
          sudo systemctl start tremolo-music

      # dist/tremolo-frontend/browser/, not dist/: the Angular application
      # builder emits per-project, and splits the browser bundle from the
      # server one. The trailing slash matters -- it copies the contents,
      # not the directory.
      - name: Sync Frontend to Reverse Proxy
        run: |
          rsync -avz --delete frontend/dist/tremolo-frontend/browser/ ${{ inputs.frontend-dest }}

      - name: Health Check
        run: |
          set -a && source /etc/tremolo/.env && set +a
          sleep 5
          curl -f http://localhost:$USER_SERVICE_PORT/health
          curl -f http://localhost:$MUSIC_SERVICE_PORT/music/health
