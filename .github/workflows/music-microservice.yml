name: FastAPI Checks

# No pull_request trigger: on a PR this runs once, via the CI gate
# (.github/workflows/ci.yml) as a workflow_call. The gate path-filters to
# backend/music, this workflow, and the Makefile -- the same paths this used
# to filter on directly -- so PR coverage is unchanged with no double-run.
on:
  push:
    branches: [main]
    paths:
      - "backend/music/**"
      - ".github/workflows/music-microservice.yml"
      - "Makefile"
  # Reusable: the CI gate and the deploy workflows run this via workflow_call.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix with the caller's workflow name so a gate-invoked run and any
  # other caller of this reusable workflow never share a group.
  group: ${{ github.workflow }}-music-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/music/requirements.txt

      - name: Install dependencies
        working-directory: backend/music
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: black --check + flake8 + pytest.
      - name: Check (format + lint + test)
        run: make check-music
