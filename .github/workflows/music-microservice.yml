name: FastAPI Checks

on:
  push:
    branches: [main]
    paths:
      - "backend/music/**"
      - ".github/workflows/music-microservice.yml"
      - "Makefile"
  # Reusable, and the only path this runs on a PR: the CI gate calls it
  # for the services a PR touches, and the deploy workflows call it as a
  # gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefix + github.workflow keeps each entry point in its own lane. Under
  # workflow_call github.workflow is the CALLER's name, so the prefix stops
  # the workflows a caller invokes together from sharing a group, and
  # github.workflow stops different callers (CI gate, deploy) from sharing
  # one. Same group + cancel-in-progress means they cancel each other.
  group: music-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/music/requirements.txt

      - name: Install dependencies
        working-directory: backend/music
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: black --check + flake8 + pytest.
      - name: Check (format + lint + test)
        run: make check-music
