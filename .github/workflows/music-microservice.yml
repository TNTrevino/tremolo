name: FastAPI Checks

on:
  pull_request:
    branches: [main, prod]
    paths:
      - "backend/music/**"
      # A broken edit to this workflow or the Makefile must not merge unvalidated
      - ".github/workflows/music-microservice.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "backend/music/**"
      - ".github/workflows/music-microservice.yml"
      - "Makefile"
  # Reusable: the deploy workflows run this as a gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Hardcoded prefix: when called via workflow_call, github.workflow is
  # the caller's name, which the other CI workflows would share.
  group: music-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/music/requirements.txt

      - name: Install dependencies
        working-directory: backend/music
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The checks themselves live in the Makefile so CI and local dev
      # can't drift: black --check + flake8 + pytest.
      - name: Check (format + lint + test)
        run: make check-music
