name: FastAPI Checks

on:
  pull_request:
    branches: [main, prod]
    paths:
      - "backend/music/**"
  push:
    branches: [main]
    paths:
      - "backend/music/**"
  # Reusable: the deploy workflows run this as a gate before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Hardcoded prefix: when called via workflow_call, github.workflow is
  # the caller's name, which the other CI workflows would share.
  group: music-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/music

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          echo "🧪 Running flake8..."
          # Rules come from the committed .flake8 config; no --exit-zero,
          # findings fail the build.
          flake8 . --count --statistics

      - name: Check code formatting with Black
        run: |
          echo "🧹 Checking code format..."
          black --check .

      - name: Run tests
        run: |
          echo "🧪 Running pytest..."
          pytest
