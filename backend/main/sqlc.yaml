version: "2"
sql:
  - engine: "postgresql"
    queries: "database/queries"
    schema: "database/migrations"
    gen:
      go:
        package: "generated"
        out: "database/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "bigint"
            go_type: "int64"
          - db_type: "integer"
            go_type: "int32"
          - db_type: "text"
            go_type: "string"
          - db_type: "boolean"
            go_type: "bool"
