basePath: /
definitions:
  controllers.addFriendRequest:
    properties:
      friend_id:
        type: integer
    type: object
  controllers.refreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dtos.AssignmentAttempt:
    properties:
      accuracy:
        type: integer
      attempted_date:
        type: string
      correct_questions:
        type: integer
      notes_per_minute:
        type: integer
      total_questions:
        type: integer
    type: object
  dtos.AssignmentResponse:
    properties:
      class_id:
        type: integer
      config:
        items:
          type: integer
        type: array
      created_at:
        type: string
      due_at:
        type: string
      game_type:
        type: string
      id:
        type: integer
      target_accuracy:
        type: integer
      target_questions:
        type: integer
      title:
        type: string
    type: object
  dtos.AssignmentResultRow:
    properties:
      attempt_count:
        type: integer
      best_accuracy:
        type: integer
      best_correct:
        type: integer
      first_name:
        type: string
      last_attempt_date:
        description: Empty until the student has at least one attempt ("2006-01-02").
        type: string
      last_name:
        type: string
      most_questions:
        type: integer
      student_id:
        type: integer
    type: object
  dtos.ChartDataPoint:
    properties:
      x:
        type: string
      "y":
        type: number
    type: object
  dtos.ClassResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      join_code:
        type: string
      name:
        type: string
      student_count:
        type: integer
    type: object
  dtos.CreateAssignmentRequest:
    properties:
      config:
        items:
          type: integer
        type: array
      due_at:
        type: string
      game_type:
        type: string
      target_accuracy:
        type: integer
      target_questions:
        description: Optional targets; nil means the teacher set none.
        type: integer
      title:
        type: string
    type: object
  dtos.CreateClassRequest:
    properties:
      name:
        type: string
    type: object
  dtos.CreateUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/dtos.Role'
      school_id:
        type: integer
    type: object
  dtos.DailyActivityCount:
    properties:
      date:
        type: string
      game_count:
        type: integer
    type: object
  dtos.Entry:
    properties:
      assignment_id:
        description: 'Optional: tags this entry as an attempt at a class assignment.'
        type: integer
      correct_questions:
        type: integer
      createdDate:
        $ref: '#/definitions/sql.NullString'
      createdTime:
        $ref: '#/definitions/sql.NullString'
      game_type:
        type: string
      id:
        type: integer
      notes_per_minute:
        type: number
      time_length:
        type: string
      total_questions:
        type: integer
      user_id:
        type: integer
    type: object
  dtos.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dtos.FriendDTO:
    properties:
      avatar_url:
        type: string
      first_name:
        type: string
      id:
        type: integer
      instrument:
        type: string
      last_name:
        type: string
      role:
        type: string
      school:
        type: string
    type: object
  dtos.GameSettingsRequest:
    properties:
      config:
        items:
          type: integer
        type: array
      game_type:
        type: string
    type: object
  dtos.GameSettingsResponse:
    properties:
      config:
        items:
          type: integer
        type: array
      game_type:
        type: string
      id:
        type: integer
      user_id:
        type: integer
    type: object
  dtos.GeneralUserInfoDTO:
    properties:
      created_date:
        description: 'Format: "Joined 12 Mar 2024"'
        type: string
      first_name:
        type: string
      last_name:
        type: string
      role:
        type: string
      total_duration:
        description: 'Format: "HH:MM:SS" or human-readable'
        type: string
      total_entries:
        type: integer
    type: object
  dtos.GoogleCallbackRequest:
    properties:
      code:
        type: string
      redirect_uri:
        type: string
    type: object
  dtos.JoinClassRequest:
    properties:
      join_code:
        type: string
    type: object
  dtos.KeyBindings:
    properties:
      key_a:
        type: string
      key_a_flat:
        type: string
      key_a_sharp:
        type: string
      key_b:
        type: string
      key_b_flat:
        type: string
      key_b_sharp:
        type: string
      key_c:
        type: string
      key_c_flat:
        type: string
      key_c_sharp:
        type: string
      key_d:
        type: string
      key_d_flat:
        type: string
      key_d_sharp:
        type: string
      key_e:
        type: string
      key_e_flat:
        type: string
      key_e_sharp:
        type: string
      key_f:
        type: string
      key_f_flat:
        type: string
      key_f_sharp:
        type: string
      key_g:
        type: string
      key_g_flat:
        type: string
      key_g_sharp:
        type: string
    type: object
  dtos.KeyboardBindingsRequest:
    properties:
      key_bindings:
        $ref: '#/definitions/dtos.KeyBindings'
    type: object
  dtos.KeyboardBindingsResponse:
    properties:
      id:
        type: integer
      key_bindings:
        $ref: '#/definitions/dtos.KeyBindings'
      user_id:
        type: integer
    type: object
  dtos.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dtos.LoginResponse:
    properties:
      access_token:
        type: string
      account_linked:
        type: boolean
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dtos.UserResponse'
    type: object
  dtos.MultiMetricChartData:
    properties:
      accuracy:
        items:
          $ref: '#/definitions/dtos.ChartDataPoint'
        type: array
      npm:
        items:
          $ref: '#/definitions/dtos.ChartDataPoint'
        type: array
      sessionCount:
        items:
          $ref: '#/definitions/dtos.ChartDataPoint'
        type: array
      totalQuestions:
        items:
          $ref: '#/definitions/dtos.ChartDataPoint'
        type: array
    type: object
  dtos.NoteGameEntryResponse:
    properties:
      correct_questions:
        type: integer
      created_date:
        type: string
      id:
        type: integer
      notes_per_minute:
        type: number
      time_length:
        type: string
      total_questions:
        type: integer
      user_id:
        type: integer
    type: object
  dtos.NoteGameSettingsRequest:
    properties:
      clef:
        type: string
      game_mode:
        type: string
      high_note:
        type: string
      low_note:
        type: string
      note_limit:
        type: integer
      octave:
        type: integer
      scale:
        type: string
      time_limit:
        type: integer
    type: object
  dtos.NoteGameSettingsResponse:
    properties:
      clef:
        type: string
      game_mode:
        type: string
      high_note:
        type: string
      id:
        type: integer
      low_note:
        type: string
      note_limit:
        type: integer
      octave:
        type: integer
      scale:
        type: string
      time_limit:
        type: integer
      user_id:
        type: integer
    type: object
  dtos.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  dtos.RegisterResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/dtos.UserResponse'
    type: object
  dtos.Role:
    enum:
    - ADMIN
    - TEACHER
    - PARENT
    - STUDENT
    type: string
    x-enum-varnames:
    - Admin
    - Teacher
    - Parent
    - Student
  dtos.RosterEntryResponse:
    properties:
      first_name:
        type: string
      joined_at:
        type: string
      last_name:
        type: string
      student_id:
        type: integer
    type: object
  dtos.StudentAssignmentResponse:
    properties:
      attempt_count:
        type: integer
      best_accuracy:
        type: integer
      best_correct:
        type: integer
      class_id:
        type: integer
      class_name:
        type: string
      config:
        items:
          type: integer
        type: array
      created_at:
        type: string
      due_at:
        type: string
      game_type:
        type: string
      id:
        type: integer
      target_accuracy:
        type: integer
      target_questions:
        type: integer
      title:
        type: string
    type: object
  dtos.StudentClassResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      teacher_name:
        type: string
    type: object
  dtos.User:
    properties:
      created_date:
        $ref: '#/definitions/sql.NullString'
      created_time:
        $ref: '#/definitions/sql.NullString'
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      role:
        $ref: '#/definitions/dtos.Role'
      school_id:
        type: integer
    type: object
  dtos.UserResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      has_google:
        type: boolean
      id:
        type: integer
      last_name:
        type: string
      role:
        type: string
    type: object
  sql.NullString:
    properties:
      string:
        type: string
      valid:
        description: Valid is true if String is not NULL
        type: boolean
    type: object
info:
  contact: {}
  description: Core API for Tremolo (auth, users/teachers/friends, game settings,
    score entries, classes/assignments, dashboard charts).
  title: Tremolo Core API
  version: "1.0"
paths:
  /api/assignments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.StudentAssignmentResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my assignments
      tags:
      - assignments
  /api/assignments/{id}:
    delete:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an assignment
      tags:
      - assignments
  /api/assignments/{id}/attempts/{studentId}:
    get:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Student user ID
        in: path
        name: studentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.AssignmentAttempt'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a student's attempt history on an assignment
      tags:
      - assignments
  /api/assignments/{id}/results:
    get:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.AssignmentResultRow'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an assignment's results grid
      tags:
      - assignments
  /api/auth/google/callback:
    post:
      consumes:
      - application/json
      parameters:
      - description: Authorization code and redirect URI
        in: body
        name: callback
        required: true
        schema:
          $ref: '#/definitions/dtos.GoogleCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Invalid authorization code or Google token
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Google email is not verified
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Email already linked to a different Google account
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Complete Google OAuth sign-in
      tags:
      - auth
  /api/auth/google/link:
    post:
      consumes:
      - application/json
      parameters:
      - description: Authorization code and redirect URI
        in: body
        name: callback
        required: true
        schema:
          $ref: '#/definitions/dtos.GoogleCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Invalid authorization code, Google token, or unauthenticated
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Email mismatch or unverified Google email
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Google account already linked elsewhere
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Link a Google account
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.LoginResponse'
        "400":
          description: Invalid request body or credentials
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Invalid credentials or locked account
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.refreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: access_token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Refresh token is required
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Refresh an access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: New account details
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/dtos.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.RegisterResponse'
        "400":
          description: Invalid request body or email already registered
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Register a new account
      tags:
      - auth
  /api/charts/teacher/class-metrics:
    get:
      parameters:
      - description: day, week, month, or year
        in: query
        name: interval
        type: string
      - description: Lookback window in days (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.MultiMetricChartData'
        "400":
          description: Invalid interval or days
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Only teachers can access class metrics
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get aggregated class chart metrics
      tags:
      - charts
  /api/charts/user/{userId}/metrics:
    get:
      parameters:
      - description: User ID (must match the authenticated user)
        in: path
        name: userId
        required: true
        type: integer
      - description: day, week, month, or year
        in: query
        name: interval
        type: string
      - description: Lookback window in days (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.MultiMetricChartData'
        "400":
          description: Invalid user ID, interval, or days
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get personal chart metrics
      tags:
      - charts
  /api/classes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.ClassResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List owned classes
      tags:
      - classes
    post:
      consumes:
      - application/json
      parameters:
      - description: Class to create
        in: body
        name: class
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateClassRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ClassResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a class
      tags:
      - classes
  /api/classes/{id}:
    delete:
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive a class
      tags:
      - classes
  /api/classes/{id}/assignments:
    get:
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.AssignmentResponse'
            type: array
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a class's assignments
      tags:
      - assignments
    post:
      consumes:
      - application/json
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assignment to create
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateAssignmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.AssignmentResponse'
        "400":
          description: Invalid id or request body
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an assignment
      tags:
      - assignments
