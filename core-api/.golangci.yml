version: "2"

# CI config for core-api. `make lint-go` and `make check-go` both run
# `golangci-lint run`, which reads this file.
#
# Everything enabled here reports zero findings on a clean tree. Each one
# is a guard against a regression, not a backlog. Before adding a linter,
# fix what it finds in the same change -- a linter that ships red teaches
# people to ignore the run.

linters:
  # The default set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

  enable:
    # -- error handling ------------------------------------------------
    # Controllers route every response off errors.Is against the sentinels
    # in services/errors.go. A `==` comparison or a `%v` wrap breaks that
    # routing silently the moment a layer wraps the error.
    - errorlint
    # A `return nil` inside an `if err != nil` block. Swallows the failure.
    - nilerr

    # -- layering ------------------------------------------------------
    # The controller -> service -> repository rule from CLAUDE.md, made
    # enforceable. See the depguard settings below.
    - depguard

    # -- resource leaks ------------------------------------------------
    # An unclosed HTTP body or sql.Rows leaks a connection. None of these
    # fail loudly at runtime, which is exactly why they need a linter.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # -- correctness traps ---------------------------------------------
    # Each covers a bug class that compiles and passes review.
    - durationcheck # time.Duration multiplied by a Duration
    - makezero # make([]T, n) then append, silently prefixing n zeros
    - errchkjson # json.Marshal on a type that cannot fail, or one that can
    - asasalint # a []any passed to a variadic ...any, which nests it
    - reassign # assignment to another package's exported variable
    - exhaustive # a switch over an enum type that misses a case
    - musttag # a struct serialised without tags on every field
    - predeclared # a variable shadowing `len`, `cap`, `error`, `new`
    - wastedassign # a value assigned and then overwritten unread
    - copyloopvar # a leftover pre-Go-1.22 `x := x` loop copy
    - bidichk # bidirectional unicode that hides what code does
    - gocheckcompilerdirectives # a malformed //go: directive, silently ignored

    # -- test hygiene --------------------------------------------------
    - usetesting # context.Background() where t.Context() belongs
    - tparallel # t.Parallel() used inconsistently across subtests

  settings:
    errorlint:
      # `err == target` / `err != target`. Use errors.Is.
      comparison: true
      # `err.(T)` and `switch err.(type)`. Use errors.As.
      asserts: true
      # A %v or %s verb applied to an error in fmt.Errorf. Use %w.
      errorf: true

    depguard:
      # These three rules encode the layering invariant the README and
      # CLAUDE.md describe in prose. They pass today; they exist so a
      # future shortcut fails CI instead of quietly setting a precedent.
      rules:
        controllers-skip-repository:
          files: ["**/controllers/*.go"]
          deny:
            - pkg: "sight-reading/database/generated"
              desc: "controllers must not reach the repository; hand a database.Querier to a service"

        services-no-response-writing:
          # net/http is deliberately NOT denied here: google_token_verifier.go
          # is an outbound HTTP client, which is a different thing from a
          # service writing a response.
          files: ["**/services/*.go"]
          deny:
            - pkg: "sight-reading/httpx"
              desc: "services return errors; controllers map them to responses"

        dtos-stay-leaves:
          files: ["**/DTOs/*.go"]
          deny:
            - pkg: "sight-reading/services"
              desc: "DTOs are leaves; a service importing a DTO is the only direction"
            - pkg: "sight-reading/database/generated"
              desc: "DTOs describe the wire shape, not the row shape; convert in services"

  exclusions:
    # sqlc writes "// Code generated by sqlc. DO NOT EDIT." at the top of
    # every file under database/generated. `lax` skips them on that header
    # alone, but name the directory too so a header change cannot quietly
    # pull ~10k generated lines into the run.
    generated: lax
    paths:
      - database/generated

issues:
  # Show every finding. The defaults cap at 50 per linter and 3 per
  # identical message, which hides most of a clustered failure.
  max-issues-per-linter: 0
  max-same-issues: 0

# errorlint autofixes all three of its rules, but it does not add the
# "errors" import its own rewrite needs. To fix a batch:
#
#   cd core-api
#   golangci-lint run --fix
#   go run golang.org/x/tools/cmd/goimports@v0.49.0 -w .
#   gofmt -s -w .
